[package]
name = "sh-income-distributor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Custody of rental income and pull-based pro-rata claims for shareholders."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sh-share-ledger = { path = "../share_ledger" }
