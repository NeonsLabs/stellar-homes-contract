[package]
name = "sh-mortgage-pool"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mortgage lifecycle: application, milestone-gated disbursement, repayment and default."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sh-property-registry = { path = "../property_registry" }
sh-lending-pool = { path = "../lending_pool" }
