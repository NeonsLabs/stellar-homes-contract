name: Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cargo Test
        # The workspace manifest is in contracts/, not at the repository root.
        run: cargo test --manifest-path contracts/Cargo.toml --workspace --locked
